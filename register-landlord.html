<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>List your hostel – RoomDirect</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><a class="logo" href="index.html">RoomDirect</a><nav id="nav"></nav></header><main class="wrap" id="app"><h1>Landlord sign up</h1><form class="panel form" id="f"><label for="n">Full name</label><input id="n" name="name" required autocomplete="name"><label for="e">Email</label><input id="e" name="email" type="email" required autocomplete="email"><label for="ph">Phone</label><input id="ph" name="phone" type="tel" required autocomplete="tel"><label for="s">School your hostel serves</label><select id="s" name="school" required></select><label for="id">Photo of a valid ID (image, max 5 MB)</label><input id="id" name="id" type="file" accept="image/*" required><label for="p">Password (8+ characters)</label><input id="p" name="password" type="password" minlength="8" required autocomplete="new-password"><p class="err" id="msg" role="alert"></p><button class="btn">Create account</button><p class="meta">Accounts are reviewed before the Verified badge shows. Already registered? <a href="login.html">Log in</a></p></form></main><footer class="wrap note">Prototype: sample data, simulated payments, data stays in your browser.</footer><script src="js/app.js"></script><script>$('#s').innerHTML=Object.entries(SCHOOLS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
$('#f').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{await register('landlord',Object.fromEntries(fd),fd.get('id'));location.href='landlord.html'}catch(x){show(x.message)}};</script></body></html>
