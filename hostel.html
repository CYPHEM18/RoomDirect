<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Hostel – RoomDirect</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><a class="logo" href="index.html">RoomDirect</a><nav id="nav"></nav></header><main class="wrap" id="app"></main><footer class="wrap note">Prototype: sample data, simulated payments, data stays in your browser.</footer><script src="js/app.js"></script><script>
ready.then(()=>{
 const h=DB.hostels.find(x=>x.id===Q.get('id')),A=$('#app');
 if(!h){A.innerHTML='<div class="empty">Hostel not found. <a href="index.html">Back to hostels</a></div>';return}
 const o=DB.users.find(u=>u.id===h.owner);
 A.innerHTML=`<a href="index.html">← All hostels</a><h1>${E(h.name)}</h1><div class="meta">${E(h.loc)} · ${h.km} km from campus · ${SCHOOLS[h.school]} · Owner: ${E(o?o.name:'')} ${o&&o.verified?'<span class="badge">Verified</span>':'<span class="badge off">Unverified</span>'}</div>
 <div class="gal" id="gal"></div><p>${E(h.desc||'')}</p><h2>Rooms</h2><div class="panel" id="rooms"></div><div id="co"></div>`;
 if(!h.media.length)$('#gal').outerHTML='<div class="empty">The owner has not added photos or videos yet.</div>';
 h.media.forEach(m=>{const d=document.createElement('div');$('#gal').append(d);fill(d,m)});
 $('#rooms').innerHTML=h.rooms.map(r=>`<div class="room"><div><b>${N(r.price)}</b> <span class="meta">${E(r.type)} · ${r.left?r.left+' left':'Fully booked'}</span></div><button class="btn" data-r="${r.id}"${r.left?'':' disabled'}>Book</button></div>`).join('')||'<p class="meta">No rooms listed yet.</p>';
 $('#rooms').onclick=e=>{const b=e.target.closest('[data-r]');if(b)book(h,b.dataset.r)};
});
function book(h,rid){
 const u=me(),r=h.rooms.find(x=>x.id===rid),c=$('#co');
 if(!u){location.href='login.html?next='+encodeURIComponent('hostel.html?id='+h.id);return}
 if(u.role!=='student'){c.innerHTML='<div class="notice">Only student accounts can book rooms.</div>';return}
 const t=r.price+APP_FEE+SCH_FEE;
 c.innerHTML=`<div class="panel"><h2>Book ${E(r.type)} at ${E(h.name)}</h2><div class="lines"><div><span>Hostel fee (to owner)</span><span>${N(r.price)}</span></div><div><span>Platform maintenance</span><span>${N(APP_FEE)}</span></div><div><span>School commission</span><span>${N(SCH_FEE)}</span></div><div class="tot"><span>You pay</span><span>${N(t)}</span></div></div><p class="meta">Demo checkout. No money moves.</p><button class="btn" id="pay">Pay ${N(t)} (demo)</button></div>`;
 c.scrollIntoView({behavior:'smooth'});
 $('#pay').onclick=()=>{
  if(r.left<1)return;r.left--;const ref='RD-'+Math.random().toString(36).slice(2,8).toUpperCase();
  DB.bookings.push({id:uid('b'),ref,student:u.id,hostel:h.id,hname:h.name,rtype:r.type,rent:r.price,school:h.school,date:new Date().toISOString()});
  save();location.href='student.html?ok='+ref};
}</script></body></html>
