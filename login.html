<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Log in – RoomDirect</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><a class="logo" href="index.html">RoomDirect</a><nav id="nav"></nav></header><main class="wrap" id="app"><h1>Log in</h1><form class="panel form" id="f"><label for="e">Email</label><input id="e" name="email" type="email" required autocomplete="username"><label for="p">Password</label><input id="p" name="password" type="password" required autocomplete="current-password"><p class="err" id="msg" role="alert"></p><button class="btn">Log in</button>
<p class="meta">New here? <a href="register-student.html">Student sign up</a> or <a href="register-landlord.html">list your hostel</a>.</p>
<p class="meta">Demo accounts: landlord@roomdirect.test / landlord1234 and admin@roomdirect.test / admin1234</p></form></main><footer class="wrap note">Prototype: sample data, simulated payments, data stays in your browser.</footer><script src="js/app.js"></script><script>
$('#f').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
 try{const u=await login(f.email,f.password);const n=Q.get('next');location.href=n&&/^[a-z-]+\.html(\?[\w=&.-]*)?$/.test(n)?n:home(u)}catch(x){show(x.message)}};</script></body></html>
