<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>My bookings – RoomDirect</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><a class="logo" href="index.html">RoomDirect</a><nav id="nav"></nav></header><main class="wrap" id="app"></main><footer class="wrap note">Prototype: sample data, simulated payments, data stays in your browser.</footer><script src="js/app.js"></script><script>
guard('student').then(u=>{if(!u)return;
 const b=DB.bookings.filter(x=>x.student===u.id).reverse(),ok=Q.get('ok');
 $('#app').innerHTML=`<h1>My bookings</h1><p class="meta">${E(u.name)} · ${E(u.matric)} · ${SCHOOLS[u.school]}</p>${ok?'<div class="notice ok">Room booked. Your booking code is <b>'+E(ok)+'</b>. Show it to the owner when you arrive and pay the rent to them directly.</div>':''}`+
 (b.length?'<div class="tbl"><table><tr><th>Code</th><th>Hostel</th><th>Room</th><th>Paid now</th><th>Rent due at check-in</th><th>Status</th></tr>'+b.map(x=>`<tr><td>${x.ref}</td><td><a href="hostel.html?id=${x.hostel}">${E(x.hname)}</a></td><td>${E(x.rtype)}</td><td>${N(APP_FEE+SCH_FEE)}</td><td>${N(x.rent)}</td><td>${x.status||'Booked'}</td></tr>`).join('')+'</table></div><p class="meta">After you move in, open the hostel to leave a review.</p>':'<div class="empty">No bookings yet. <a href="index.html">Browse hostels</a></div>');
});</script></body></html>
