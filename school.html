<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>School dashboard – RoomDirect</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><a class="logo" href="index.html">RoomDirect</a><nav id="nav"></nav></header><main class="wrap" id="app"></main><footer class="wrap note">Prototype: sample data, simulated payments, data stays in your browser.</footer><script src="js/app.js"></script><script>
guard('school').then(u=>{if(!u)return;
 const bk=DB.bookings.filter(b=>b.school===u.school).reverse(),hs=DB.hostels.filter(h=>h.school===u.school);
 $('#app').innerHTML=`<h1>${SCHOOLS[u.school]}</h1><p class="meta">School dashboard · you earn ${N(SCH_FEE)} on every booking</p><div class="stats"><div class="stat"><span>Bookings</span><b>${bk.length}</b></div><div class="stat"><span>Your commission</span><b>${N(bk.length*SCH_FEE)}</b></div><div class="stat"><span>Listed hostels</span><b>${hs.length}</b></div><div class="stat"><span>Students checked in</span><b>${bk.filter(b=>b.status==='Checked in').length}</b></div></div><h2>Bookings</h2>`+
 (bk.length?'<div class="tbl"><table><tr><th>Code</th><th>Hostel</th><th>Room</th><th>Date</th><th>Status</th></tr>'+bk.map(b=>`<tr><td>${b.ref}</td><td>${E(b.hname)}</td><td>${E(b.rtype)}</td><td>${new Date(b.date).toLocaleDateString('en-NG')}</td><td>${b.status||'Booked'}</td></tr>`).join('')+'</table></div>':'<div class="empty">No bookings yet. Book a room as a student to see it here.</div>');
});</script></body></html>
